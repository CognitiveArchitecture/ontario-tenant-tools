<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    Favicon — the duotone pixel mark (2026-10-26), matching the duotone accent.
    Light: a lavender sprig, a bundle of three spikes (violet #5b3fa3 florets,
    lilac #8a52cc highlights, forest-green #3d6b34 stems). Dark: the pixel
    conifer in fern #6f9d52. Both on the site's 12-cell pixel grid (the same
    dialect as the 404 pixel art); both read at 16px. It follows the browser's
    colour scheme: a favicon can't see the site's own theme toggle.
    Where one image must serve both modes (favicon.png, apple-touch-icon.png,
    the OG cards), the sprig is used: scripts/generate-og.py.
  -->
  <style>
    .dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .light { display: none; }
      .dark { display: inline; }
    }
  </style>
  <g class="light" transform="translate(1 0)">
    <g fill="#5b3fa3">
      <rect x="8" y="2" width="2" height="2"/>
      <rect x="12" y="2" width="2" height="2"/>
      <rect x="10" y="4" width="2" height="2"/>
      <rect x="0" y="6" width="2" height="2"/>
      <rect x="4" y="6" width="2" height="2"/>
      <rect x="8" y="6" width="2" height="2"/>
      <rect x="12" y="6" width="2" height="2"/>
      <rect x="16" y="6" width="2" height="2"/>
      <rect x="20" y="6" width="2" height="2"/>
      <rect x="2" y="8" width="2" height="2"/>
      <rect x="10" y="8" width="2" height="2"/>
      <rect x="18" y="8" width="2" height="2"/>
      <rect x="0" y="10" width="2" height="2"/>
      <rect x="4" y="10" width="2" height="2"/>
      <rect x="8" y="10" width="2" height="2"/>
      <rect x="12" y="10" width="2" height="2"/>
      <rect x="16" y="10" width="2" height="2"/>
      <rect x="20" y="10" width="2" height="2"/>
      <rect x="2" y="12" width="2" height="2"/>
      <rect x="10" y="12" width="2" height="2"/>
      <rect x="18" y="12" width="2" height="2"/>
      <rect x="0" y="14" width="2" height="2"/>
      <rect x="4" y="14" width="2" height="2"/>
      <rect x="16" y="14" width="2" height="2"/>
      <rect x="20" y="14" width="2" height="2"/>
    </g>
    <g fill="#8a52cc">
      <rect x="10" y="0" width="2" height="2"/>
      <rect x="10" y="2" width="2" height="2"/>
      <rect x="2" y="4" width="2" height="2"/>
      <rect x="18" y="4" width="2" height="2"/>
      <rect x="2" y="6" width="2" height="2"/>
      <rect x="10" y="6" width="2" height="2"/>
      <rect x="18" y="6" width="2" height="2"/>
      <rect x="2" y="10" width="2" height="2"/>
      <rect x="10" y="10" width="2" height="2"/>
      <rect x="18" y="10" width="2" height="2"/>
      <rect x="2" y="14" width="2" height="2"/>
      <rect x="18" y="14" width="2" height="2"/>
    </g>
    <g fill="#3d6b34">
      <rect x="10" y="14" width="2" height="2"/>
      <rect x="2" y="16" width="2" height="2"/>
      <rect x="10" y="16" width="2" height="2"/>
      <rect x="18" y="16" width="2" height="2"/>
      <rect x="4" y="18" width="2" height="2"/>
      <rect x="10" y="18" width="2" height="2"/>
      <rect x="16" y="18" width="2" height="2"/>
      <rect x="6" y="20" width="10" height="2"/>
      <rect x="10" y="22" width="2" height="2"/>
    </g>
  </g>
  <g class="dark" fill="#6f9d52">
      <rect x="10" y="2" width="4" height="2"/>
      <rect x="8" y="4" width="8" height="2"/>
      <rect x="6" y="6" width="12" height="2"/>
      <rect x="8" y="8" width="8" height="2"/>
      <rect x="6" y="10" width="12" height="2"/>
      <rect x="4" y="12" width="16" height="2"/>
      <rect x="2" y="14" width="20" height="2"/>
      <rect x="10" y="16" width="4" height="4"/>
  </g>
</svg>
